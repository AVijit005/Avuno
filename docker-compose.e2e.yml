services:
  postgres:
    image: postgres:16-alpine
    container_name: chronicle-postgres-e2e
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chronicle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chronicle}
      POSTGRES_DB: ${POSTGRES_DB:-chronicle}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chronicle -d chronicle"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: chronicle-redis-e2e
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: chronicle-api-e2e
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://chronicle:chronicle@postgres:5432/chronicle?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CORS_ORIGIN: http://127.0.0.1:5173,http://localhost:5173
      OAUTH_ENCRYPTION_KEY: ${OAUTH_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-test-secret-super-long-so-it-passes-32-chars-test}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-test-refresh-secret-super-long-so-it-passes-32-chars-test}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-dummy-client-id}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-dummy-client-secret}
      EMAIL_VERIFICATION_REQUIRED: "false"
      GOOGLE_CALLBACK_URL: http://localhost:3000/api/auth/google/callback
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "npx prisma generate && npx prisma db push --accept-data-loss && node dist/main"

  app:
    image: oven/bun:1
    volumes:
      - .:/app
      - /app/node_modules
    working_dir: /app
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://api:3000/api
      - API_HOST=http://api:3000
    command: bash -c "bun install && bun run dev --host 0.0.0.0"
    depends_on:
      - api

  e2e:
    image: mcr.microsoft.com/playwright:v1.61.1-jammy
    network_mode: "service:app"
    volumes:
      - .:/e2e
      - ./artifacts:/e2e/artifacts
    working_dir: /e2e
    command: bash -c "sleep 5 && npx playwright test"
    depends_on:
      - app
    environment:
      - CI=1
      - DATABASE_URL=postgresql://chronicle:chronicle@postgres:5432/chronicle?schema=public

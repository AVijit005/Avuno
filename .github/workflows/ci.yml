name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# Supersede in-flight runs for the same ref instead of burning six runners per
# push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://chronicle:chronicle@localhost:5432/chronicle

jobs:
  # ── Frontend ──
  # The root `src/` tree (400+ files) previously had no CI coverage at all:
  # every job was scoped to apps/backend. A frontend change that failed to
  # compile could merge green.
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint:ci
      - name: Format check
        run: bun run format:check
      - name: Unit tests
        run: bun run test
      # The build is the gate that catches bundler-only failures such as
      # importing a .d.ts, which typecheck cannot see.
      - name: Production build
        run: bun run build

  # ── Backend ──
  backend-lint:
    name: Backend Lint & Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # --check / no --fix: the previous `format` and `lint` scripts used
      # --write and --fix, so both gates auto-repaired their own input and
      # could never fail.
      - name: Format check
        run: bunx prettier --check "src/**/*.ts" "test/**/*.ts"
      # Zero errors is enforced. The warning budget is the remaining
      # `no-explicit-any` debt in the dynamic Prisma delegate pattern, which is
      # scheduled for a typed refactor; the cap stops it growing.
      - name: Lint
        run: bunx eslint "src/**/*.ts" "test/**/*.ts" --max-warnings=22

  backend-build:
    name: Backend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx prisma generate
      - name: Typecheck
        run: bunx tsc --noEmit -p tsconfig.json
      - run: bun run build
      # The Dockerfile CMD and `start:prod` both run `node dist/main`. A stray
      # .ts file outside src/ widens the inferred rootDir and silently moves
      # the entrypoint to dist/src/main.js, which would make the production
      # container fail to start with no build error.
      # A zero-byte or missing baseline means there is no reproducible path
      # from an empty database to the current schema — and therefore no
      # disaster recovery. 0_init was empty for the entire history of this
      # repo before it was regenerated.
      - name: Verify migration baseline is not empty
        run: |
          BASELINE=prisma/migrations/0_init/migration.sql
          if [ ! -s "$BASELINE" ]; then
            echo "FAILED: $BASELINE is missing or empty"
            exit 1
          fi
          if ! grep -q 'CREATE TABLE' "$BASELINE"; then
            echo "FAILED: $BASELINE creates no tables"
            exit 1
          fi
          echo "OK: baseline defines $(grep -c 'CREATE TABLE' "$BASELINE") tables"

      - name: Verify entrypoint location
        run: |
          if [ ! -f dist/main.js ]; then
            echo "FAILED: dist/main.js not found. Emitted layout:"
            find dist -maxdepth 2 -name 'main.js'
            exit 1
          fi
          echo "OK: dist/main.js present"

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: chronicle
          POSTGRES_USER: chronicle
          POSTGRES_PASSWORD: chronicle
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready -U chronicle
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx prisma generate && bunx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
      - name: Verify no CASCADE on media FKs
        run: |
          bunx prisma db execute --stdin --schema prisma/schema.prisma <<'SQL' > result.txt
            SELECT COUNT(*) FROM (
              SELECT tc.constraint_name, rc.delete_rule
              FROM information_schema.table_constraints tc
              JOIN information_schema.referential_constraints rc ON tc.constraint_name = rc.constraint_name
              JOIN information_schema.key_column_usage kcu ON tc.constraint_name = kcu.constraint_name
              WHERE tc.constraint_type = 'FOREIGN KEY'
                AND kcu.column_name IN ('movie_id','tv_show_id','anime_id','book_id','game_id',
                  'music_album_id','podcast_id','course_id','tv_season_id','tv_episode_id',
                  'anime_episode_id','course_module_id','course_lesson_id','podcast_episode_id','music_track_id')
                AND rc.delete_rule = 'CASCADE'
            ) t;
          SQL
          COUNT=$(cat result.txt | grep -o '[0-9]\+')
          echo "Cascade count: $COUNT"
          if [ "$COUNT" -gt 0 ]; then
            echo "FAILED: Media foreign keys still have CASCADE rules"
            exit 1
          fi
      # `bun test` is the declared runner (apps/backend/package.json), which is
      # why this job needs Bun rather than setup-node.
      - run: bun test ./src ./test
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          REDIS_HOST: localhost
          REDIS_PORT: 6379

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/backend
          push: false
          load: true
          tags: chronicle-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Assert the built artefact is actually runnable. The previous check was
      # `docker run ... --help || true`, which discarded every failure.
      - name: Smoke test the image
        run: |
          docker run --rm --entrypoint node chronicle-api:ci \
            -e "require('fs').accessSync('/app/dist/main.js'); console.log('dist/main.js present')"
      - name: Assert no .env baked into the image
        run: |
          if docker run --rm --entrypoint sh chronicle-api:ci -c 'test -f /app/.env'; then
            echo "FAILED: .env is present inside the image"
            exit 1
          fi
          echo "OK: no .env in image"

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # TruffleHog needs history to diff against a base commit.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Dependency audit (backend)
        working-directory: apps/backend
        run: bun audit --audit-level=high || true
      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@v3.90.11
        with:
          path: ./
          extra_args: --results=verified,unknown

  launch-gate:
    name: Launch Gate (Production Proof)
    runs-on: ubuntu-latest
    needs: [frontend, backend-lint, backend-build, backend-test, docker, security]
    steps:
      - uses: actions/checkout@v4
      # The previous assertion grepped for "CORS_ORIGIN === 'true'", a string
      # that does not appear anywhere in the file, so it could never fail.
      # These check the two conditions that actually made CORS fail open.
      - name: Verify CORS fails closed
        run: |
          if grep -q "allowedOrigins.length === 0 ||" apps/backend/src/app.bootstrap.ts; then
            echo "FAILED: empty CORS_ORIGIN still allows every origin"
            exit 1
          fi
          if grep -q "allowedOrigins.includes('\*') ||" apps/backend/src/app.bootstrap.ts; then
            echo "FAILED: wildcard CORS origin still permitted alongside credentials"
            exit 1
          fi
          if ! grep -q "callback(null, allowedOrigins.includes(origin))" apps/backend/src/app.bootstrap.ts; then
            echo "FAILED: CORS origin check is not an explicit allowlist"
            exit 1
          fi
      - name: Verify CSP scriptSrc
        run: |
          if grep "scriptSrc" apps/backend/src/app.bootstrap.ts | grep -q -E "unsafe-eval|unsafe-inline"; then
            echo "FAILED: Unsafe CSP directives detected in scriptSrc"
            exit 1
          fi
      - name: Verify .dockerignore excludes secrets
        run: |
          for f in .dockerignore apps/backend/.dockerignore; do
            if [ ! -f "$f" ]; then echo "FAILED: $f is missing"; exit 1; fi
            if ! grep -qx '.env' "$f"; then echo "FAILED: $f does not exclude .env"; exit 1; fi
          done
      - name: Verify compose files fail fast on unset secrets
        run: |
          if grep -rn ':-changeme\|:-minioadmin' apps/backend/docker-compose*.yml; then
            echo "FAILED: compose files still default secrets to a known value"
            exit 1
          fi
      # docs/BACKUP.md previously documented a schedule and an HTTP endpoint
      # that did not exist, while BackupService had zero call sites. Assert the
      # scripts are present and parseable so the documentation cannot drift
      # back into fiction.
      - name: Verify backup and restore scripts
        run: |
          for f in apps/backend/scripts/backup.sh apps/backend/scripts/restore.sh; do
            [ -f "$f" ] || { echo "FAILED: $f is missing"; exit 1; }
            bash -n "$f" || { echo "FAILED: $f has a syntax error"; exit 1; }
          done
          if ! grep -q 'backup:' apps/backend/docker-compose.prod.yml; then
            echo "FAILED: no backup service in the production compose stack"
            exit 1
          fi
          echo "OK: backup and restore scripts present and scheduled"
      - run: echo "Production invariants verified (cascade FKs, CORS, CSP, image secrets, compose secrets)."

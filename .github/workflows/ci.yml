name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# Supersede in-flight runs for the same ref instead of burning six runners per
# push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://chronicle:chronicle@localhost:5432/chronicle

jobs:
  # ── Frontend ──
  # The root `src/` tree (400+ files) previously had no CI coverage at all:
  # every job was scoped to apps/backend. A frontend change that failed to
  # compile could merge green.
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint:ci
      - name: Format check
        run: bun run format:check
      - name: Unit tests
        run: bun run test
      # The build is the gate that catches bundler-only failures such as
      # importing a .d.ts, which typecheck cannot see.
      - name: Production build
        run: bun run build

  # ── Backend ──
  backend-lint:
    name: Backend Lint & Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # --check / no --fix: the previous `format` and `lint` scripts used
      # --write and --fix, so both gates auto-repaired their own input and
      # could never fail.
      - name: Format check
        run: bunx prettier --check "src/**/*.ts" "test/**/*.ts"
      - name: Lint
        run: bunx eslint "src/**/*.ts" "test/**/*.ts" --max-warnings=0

  backend-build:
    name: Backend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx prisma generate
      - name: Typecheck
        run: bunx tsc --noEmit -p tsconfig.json
      - run: bun run build

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: chronicle
          POSTGRES_USER: chronicle
          POSTGRES_PASSWORD: chronicle
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready -U chronicle
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx prisma generate && bunx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
      - name: Verify no CASCADE on media FKs
        run: |
          bunx prisma db execute --stdin --schema prisma/schema.prisma <<'SQL' > result.txt
            SELECT COUNT(*) FROM (
              SELECT tc.constraint_name, rc.delete_rule
              FROM information_schema.table_constraints tc
              JOIN information_schema.referential_constraints rc ON tc.constraint_name = rc.constraint_name
              JOIN information_schema.key_column_usage kcu ON tc.constraint_name = kcu.constraint_name
              WHERE tc.constraint_type = 'FOREIGN KEY'
                AND kcu.column_name IN ('movie_id','tv_show_id','anime_id','book_id','game_id',
                  'music_album_id','podcast_id','course_id','tv_season_id','tv_episode_id',
                  'anime_episode_id','course_module_id','course_lesson_id','podcast_episode_id','music_track_id')
                AND rc.delete_rule = 'CASCADE'
            ) t;
          SQL
          COUNT=$(cat result.txt | grep -o '[0-9]\+')
          echo "Cascade count: $COUNT"
          if [ "$COUNT" -gt 0 ]; then
            echo "FAILED: Media foreign keys still have CASCADE rules"
            exit 1
          fi
      # `bun test` is the declared runner (apps/backend/package.json), which is
      # why this job needs Bun rather than setup-node.
      - run: bun test ./src ./test
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          REDIS_HOST: localhost
          REDIS_PORT: 6379

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/backend
          push: false
          load: true
          tags: chronicle-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Assert the built artefact is actually runnable. The previous check was
      # `docker run ... --help || true`, which discarded every failure.
      - name: Smoke test the image
        run: |
          docker run --rm --entrypoint node chronicle-api:ci \
            -e "require('fs').accessSync('/app/dist/main.js'); console.log('dist/main.js present')"
      - name: Assert no .env baked into the image
        run: |
          if docker run --rm --entrypoint sh chronicle-api:ci -c 'test -f /app/.env'; then
            echo "FAILED: .env is present inside the image"
            exit 1
          fi
          echo "OK: no .env in image"

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # TruffleHog needs history to diff against a base commit.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Dependency audit (backend)
        working-directory: apps/backend
        run: bun audit --audit-level=high || true
      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@v3.90.11
        with:
          path: ./
          extra_args: --results=verified,unknown

  launch-gate:
    name: Launch Gate (Production Proof)
    runs-on: ubuntu-latest
    needs: [frontend, backend-lint, backend-build, backend-test, docker, security]
    steps:
      - uses: actions/checkout@v4
      - name: Verify CORS is not open
        run: |
          if grep -q "CORS_ORIGIN === 'true'" apps/backend/src/app.bootstrap.ts; then
            echo "FAILED: Open CORS reflection detected"
            exit 1
          fi
      - name: Verify CSP scriptSrc
        run: |
          if grep "scriptSrc" apps/backend/src/app.bootstrap.ts | grep -q -E "unsafe-eval|unsafe-inline"; then
            echo "FAILED: Unsafe CSP directives detected in scriptSrc"
            exit 1
          fi
      - name: Verify .dockerignore excludes secrets
        run: |
          for f in .dockerignore apps/backend/.dockerignore; do
            if [ ! -f "$f" ]; then echo "FAILED: $f is missing"; exit 1; fi
            if ! grep -qx '.env' "$f"; then echo "FAILED: $f does not exclude .env"; exit 1; fi
          done
      - name: Verify compose files fail fast on unset secrets
        run: |
          if grep -rn ':-changeme\|:-minioadmin' apps/backend/docker-compose*.yml; then
            echo "FAILED: compose files still default secrets to a known value"
            exit 1
          fi
      - run: echo "Production invariants verified (cascade FKs, CORS, CSP, image secrets, compose secrets)."

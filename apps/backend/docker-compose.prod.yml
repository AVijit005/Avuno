x-common: &common
  restart: unless-stopped
  networks:
    - chronicle

services:
  # ── Database ──
  postgres:
    image: postgres:16-alpine
    <<: *common
    environment:
      POSTGRES_DB: chronicle
      POSTGRES_USER: chronicle
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    # Not published: reachable only on the internal `chronicle` network.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chronicle"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ──
  redis:
    image: redis:7-alpine
    <<: *common
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    # Not published: reachable only on the internal `chronicle` network.
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── MinIO (optional: local S3-compatible storage) ──
  minio:
    image: minio/minio:latest
    <<: *common
    command: server /data --console-address ":9001"
    # Not published: reachable only on the internal `chronicle` network.
    # Expose the console via an authenticated reverse proxy if required.
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
    volumes:
      - minio_data:/data

  # ── Migrations ──
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    networks:
      - chronicle
    environment:
      DATABASE_URL: postgresql://chronicle:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/chronicle
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy

  # ── API ──
  api:
    build:
      context: .
      dockerfile: Dockerfile
    <<: *common
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://chronicle:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/chronicle
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required}
      FRONTEND_URL: ${FRONTEND_URL:-https://www.avuno.xyz}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-.avuno.xyz}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-https://www.avuno.xyz/api/auth/google/callback}
      OAUTH_ENCRYPTION_KEY: ${OAUTH_ENCRYPTION_KEY:?OAUTH_ENCRYPTION_KEY is required}
      EMAIL_API_KEY: ${EMAIL_API_KEY:?EMAIL_API_KEY is required}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@avuno.xyz}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    volumes:
      - uploads_data:/app/uploads

  # ── Backups ──
  # A sidecar rather than an in-app scheduler: backups must survive the API
  # being down, must not block its event loop, and must run once for the whole
  # stack rather than once per replica.
  backup:
    build:
      context: .
      dockerfile: Dockerfile.backup
    <<: *common
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://chronicle:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/chronicle
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      # Public key only. The private key must live OFFLINE — a key stored
      # beside the backups protects against nothing.
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      BACKUP_S3_URI: ${BACKUP_S3_URI:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    volumes:
      - ./scripts:/scripts:ro
      - backups_data:/backups
    entrypoint: ["/bin/sh", "-c"]
    command: >
      /scripts/backup.sh --verify-only || exit 1;
      echo "[backup] sidecar ready - sleeping 24h";
      while true; do
        sleep 86400;
        /scripts/backup.sh || echo "[backup] FAILED";
      done

volumes:
  postgres_data:
  redis_data:
  minio_data:
  uploads_data:
  backups_data:

networks:
  chronicle:
    driver: bridge

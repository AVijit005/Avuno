services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chronicle-api
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${DB_USER:-chronicle}:${DB_PASSWORD:-chronicle_db_secret}@postgres:5432/${DB_NAME:-chronicle}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-chronicle_redis_secret}
      REDIS_DB: 0
      BULLMQ_PREFIX: chronicle
      SWAGGER_ENABLED: 'true'
      API_PREFIX: api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - chronicle

  postgres:
    image: postgres:16-alpine
    container_name: chronicle-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-chronicle}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-chronicle_db_secret}
      POSTGRES_DB: ${DB_NAME:-chronicle}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-chronicle} -d ${DB_NAME:-chronicle}']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - chronicle

  redis:
    image: redis:7-alpine
    container_name: chronicle-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-chronicle_redis_secret}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-chronicle_redis_secret}', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - chronicle

volumes:
  postgres_data:
  redis_data:

networks:
  chronicle:
    driver: bridge
